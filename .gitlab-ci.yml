# GitLab CI for dfdiagnoser on LLNL czgitlab (converted from .github/workflows/ci.yml).
# Runs on the LC corona shell runner, with the work executed inside a single
# Flux allocation, via modules + venv instead of GitHub-hosted ubuntu runners
# with setup-uv.

stages: [alloc, test, build, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    # 2h is a ceiling, not a reservation.
    LARGE_QUEUE: pbatch
    LARGE_QUEUE_WALLTIME: 120

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - ALLOC_NAME=dfdiagnoser-ci-$CI_PIPELINE_ID-$CI_JOB_ID
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# Shared allocation; tests + docs both run on it via flux proxy.
build-and-test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    # Tag pipelines run the full suite, everything else the smoke subset.
    - if [ -n "$CI_COMMIT_TAG" ]; then TEST_TYPE=full; else TEST_TYPE=smoke; fi
    - 'echo "Running test suite: $TEST_TYPE"'
    # flux run -N 1 executes the script ON the allocated node; podman provides
    # the python environment (mirrors the GitHub Actions CI).
    - flux proxy "$JOBID" flux run -N 1 --env=TEST_TYPE="$TEST_TYPE" bash .gitlab/ci/build-test-docs.sh
  artifacts:
    paths: [public]

# Publishes the artifact from build-and-test — shell runner, no allocation.
wheels:
  extends: .corona-flux
  stage: build
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - JOBID=$(cat .flux-jobid)
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/wheels.sh
  artifacts:
    paths: [wheelhouse/]

# Needs both producers, so a failed wheel or test run publishes nothing.
distribute:
  extends: .corona-flux
  stage: deploy
  needs: [wheels, build-and-test]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - bash .gitlab/ci/distribute.sh

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → build-and-test → wheels → deallocate.
  needs: [allocate, build-and-test, {job: wheels, optional: true}]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - test -s .flux-jobid && flux cancel "$(cat .flux-jobid)" || true
